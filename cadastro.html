<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Checkout - Essência Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <svg class="logo-img" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2">
                <path d="M12 22a7 7 0 0 0 7-7c0-4.3-7-13-7-13S5 10.7 5 15a7 7 0 0 0 7 7z"/>
            </svg>
            <h1>Essência Premium</h1>
        </div>
        <nav>
            <a href="index.html">Início</a>
            <a href="carrinho.html">Carrinho 🛒</a>
            <a href="cadastro.html">Entrar/Cadastrar</a>
        </nav>
    </header>
    <main>
        <h2 style="margin-bottom: 20px;">Finalização do Pedido</h2>
        <form action="#" method="POST">
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" required placeholder="Digite seu nome completo">
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" required placeholder="seuemail@exemplo.com">
                </div>
                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00">
                </div>
                <div class="form-group">
                    <label for="tel">Telefone / WhatsApp:</label>
                    <input type="tel" id="tel" required placeholder="(11) 99999-9999">
                </div>
                <div class="form-group">
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" required>
                </div>
                <div class="form-group">
                    <label for="senha">Criar Senha:</label>
                    <input type="password" id="senha" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="avatar">Foto de Perfil (Opcional):</label>
                    <input type="file" id="avatar" accept="image/*">
                </div>
            </fieldset>
            <fieldset>
                <legend>Endereço de Entrega</legend>

                <div class="form-group">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" required placeholder="00000-000">
                </div>

                <div class="form-group">
                    <label for="rua">Rua/Logradouro:</label>
                    <input type="text" id="rua" required>
                </div>

                <div class="form-group">
                    <label for="numero">Número:</label>
                    <input type="text" id="numero" required>
                </div>

                <div class="form-group">
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" required>
                </div>

                <div class="form-group">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" required>
                </div>

                <div class="form-group">
                    <label for="estado">Estado:</label>
                    <select id="estado" required>
                        <option value="">Selecione...</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                    </select>
                </div>
            </fieldset>
            <fieldset>
                <legend>Método de Pagamento</legend>
                <p>Selecione uma das opções abaixo:</p>
                <div class="payment-methods">
                    <label class="payment-option">
                        <input type="radio" name="pagamento" value="pix" required>
                        <span>⚡ PIX</span>
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="pagamento" value="cartao">
                        <span>💳 Cartão de Crédito</span>
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="pagamento" value="boleto">
                        <span>📄 Boleto Bancário</span>
                    </label>
                </div>
            </fieldset>
            <div style="margin: 20px 0; display: flex; gap: 10px; align-items: center;">
                <input type="checkbox" id="termos" required>
                <label for="termos">Li e aceito os Termos de Uso e Políticas do site.</label>
            </div>
            <button type="submit" class="btn-checkout" style="width: 100%; border: none; cursor: pointer; font-size: 16px;">
                Concluir Cadastro e Pagar
            </button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Essência Premium. Imagens da Perfumaria Fictícia. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
